<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tashqi siyosat ustuvorliklari</title>
<style>
  :root{--ink:#eaf1f8;--mut:#8fb0cf;--acc:#3d9be0;--line:rgba(255,255,255,.09);--mono:'IBM Plex Mono',ui-monospace,monospace;--serif:Georgia,'Times New Roman',serif;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:-apple-system,Segoe UI,Roboto,Inter,sans-serif;background:radial-gradient(120% 120% at 50% 0,#0d2340,#0a1a2e 60%);color:var(--ink);min-height:100vh;padding:38px 26px 48px;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:820px;margin:0 auto;}
  .kick{font-family:var(--mono);font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:var(--acc);opacity:.9;}
  h1{font-family:var(--serif);font-weight:600;font-size:clamp(28px,5vw,44px);line-height:1.1;margin:10px 0 6px;}
  .sub{color:var(--mut);font-size:15px;max-width:60ch;margin-bottom:30px;}
  .item{border:1px solid var(--line);border-radius:16px;margin-bottom:12px;overflow:hidden;background:linear-gradient(160deg,rgba(61,155,224,.06),rgba(61,155,224,0));transition:border-color .2s;}
  .item.open{border-color:rgba(61,155,224,.45);}
  .head{display:flex;align-items:center;gap:16px;padding:18px 20px;cursor:pointer;user-select:none;}
  .num{font-family:var(--mono);font-size:13px;color:var(--acc);flex:0 0 auto;width:30px;}
  .ic{flex:0 0 auto;width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;background:rgba(61,155,224,.14);}
  .ttl{flex:1;font-weight:600;font-size:16.5px;font-family:var(--serif);}
  .chev{flex:0 0 auto;color:var(--mut);transition:transform .25s;}
  .item.open .chev{transform:rotate(180deg);color:var(--acc);}
  .body{max-height:0;overflow:hidden;transition:max-height .35s ease;}
  .body-in{padding:0 20px 20px 66px;color:var(--mut);font-size:14.5px;line-height:1.6;}
  .tags{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px;}
  .tag{font-family:var(--mono);font-size:11px;letter-spacing:.04em;padding:4px 11px;border-radius:999px;background:rgba(255,255,255,.06);color:var(--ink);border:1px solid var(--line);}
  .foot{margin-top:34px;padding-top:18px;border-top:1px solid var(--line);color:var(--mut);font-size:12px;font-family:var(--mono);display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;}
  .foot b{color:var(--ink);}
</style>
</head>
<body>
<div class="wrap">
  <div class="kick">Interaktiv infografika · TSTM</div>
  <h1>Tashqi siyosat ustuvorliklari</h1>
  <p class="sub">Markaz tahlil qiladigan asosiy yo'nalishlar. Batafsil ko'rish uchun qatorni oching.</p>

  <div id="acc"></div>

  <div class="foot"><span>Tayyorladi: <b>TSTM tahliliy guruhi (namoyish)</b></span><span>© TSTM · 2026</span></div>
</div>
<script>
  var items=[
    {ic:'🤝',t:'Mintaqaviy diplomatiya',d:'Markaziy Osiyo davlatlari o‘rtasidagi ko‘p tomonlama hamkorlikni chuqurlashtirish, ishonch choralari va umumiy kun tartibini shakllantirish.',tags:['Ko‘p tomonlama','Ishonch choralari','Qo‘shni siyosat']},
    {ic:'🛡️',t:'Mintaqaviy xavfsizlik',d:'Chegara barqarorligi, suv-energetika masalalari va noan’anaviy tahdidlarga qarshi muvofiqlashtirilgan yondashuvlar bo‘yicha strategik tahlil.',tags:['Barqarorlik','Suv-energetika','Noan’anaviy tahdid']},
    {ic:'📊',t:'Iqtisodiy integratsiya',d:'Transport yo‘laklari, savdo osonlashtirilishi va investitsiya oqimlari orqali mintaqaning global qiymat zanjirlariga qo‘shilishi.',tags:['Transport yo‘laklari','Savdo','Investitsiya']},
    {ic:'🌍',t:'Global tartib va prognoz',d:'Xalqaro tartibdagi o‘zgarishlar, geosiyosiy ssenariylar va ularning mintaqaga ta’sirini baholovchi strategik prognozlar.',tags:['Geosiyosat','Ssenariy tahlili','Prognoz']},
    {ic:'⚡',t:'Energetika va barqarorlik',d:'Energetik xavfsizlik, iqlim siyosati va barqaror rivojlanish maqsadlari kesimida mintaqaviy hamkorlik imkoniyatlari.',tags:['Energetika','Iqlim','SDG']}
  ];
  var acc=document.getElementById('acc');
  items.forEach(function(it,i){
    var el=document.createElement('div'); el.className='item';
    el.innerHTML='<div class="head"><span class="num">'+(i+1<10?'0':'')+(i+1)+'</span><span class="ic">'+it.ic+'</span>'+
      '<span class="ttl">'+it.t+'</span><svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg></div>'+
      '<div class="body"><div class="body-in">'+it.d+'<div class="tags">'+it.tags.map(function(t){return '<span class="tag">'+t+'</span>';}).join('')+'</div></div></div>';
    var body=el.querySelector('.body');
    el.querySelector('.head').onclick=function(){
      var open=el.classList.contains('open');
      // bittasi ochiq bo'lsin (akordeon)
      acc.querySelectorAll('.item.open').forEach(function(o){ o.classList.remove('open'); o.querySelector('.body').style.maxHeight='0'; });
      if(!open){ el.classList.add('open'); body.style.maxHeight=body.scrollHeight+'px'; }
    };
    acc.appendChild(el);
  });
  // birinchisini ochiq boshlaymiz
  var first=acc.querySelector('.item'); if(first){ first.classList.add('open'); var b=first.querySelector('.body'); b.style.maxHeight=b.scrollHeight+'px'; }
</script>
</body>
</html>
