<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yo'nalish — TSTM</title>
<meta name="description" content="TSTM markazining tadqiqot yo'nalishi bo'yicha materiallar.">
<link rel="icon" href="logo-mark.png">
<meta property="og:type" content="website">
<meta property="og:site_name" content="TSTM">
<meta property="og:title" content="Yo'nalish — TSTM">
<meta property="og:description" content="TSTM markazining tadqiqot yo'nalishi bo'yicha materiallar.">
<meta property="og:image" content="logo-mark.png">
<meta name="twitter:card" content="summary">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;500;600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="site.css?v=76">
<style>
  .yo-intro{display:grid;grid-template-columns:88px 1fr;gap:30px;align-items:start;max-width:880px;}
  .yo-intro .ico{width:88px;height:88px;border:1px solid color-mix(in srgb,var(--accent) 35%,var(--line));border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--accent);}
  .yo-intro .ico svg{width:38px;height:38px;}
  .yo-intro .label{font-family:var(--mono);font-size:0.6875rem;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);margin-bottom:14px;}
  .yo-intro p{font-size:1.0625rem;line-height:1.85;color:var(--ink-2);margin:0;}
  .yo-focus{display:flex;gap:10px;flex-wrap:wrap;margin-top:26px;}
  .yo-focus .ch{font-family:var(--mono);font-size:0.71875rem;letter-spacing:.04em;color:var(--ink-2);border:1px solid var(--line);border-radius:30px;padding:8px 15px;background:var(--panel);}
  @media(max-width:680px){.yo-intro{grid-template-columns:1fr;gap:20px}}
</style>
</head>
<body>
<main>
  <div class="page-banner"><div class="wrap">
    <div class="crumb"><a href="Bosh sahifa - Hi-Fi.html" data-i18n="home">Bosh sahifa</a><span class="sep">/</span><a href="tadqiqotlar.html" data-i18n="nav_research">Tadqiqotlar</a><span class="sep">/</span><span id="cr">—</span></div>
    <h1 id="yotitle">—</h1>
    <p class="lead" id="yolead"></p>
  </div></div>

  <section class="block"><div class="wrap">
    <div class="yo-intro rv">
      <div class="ico"><svg id="yoicon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></svg></div>
      <div>
        <div class="label" data-i18n="yo_about">Yo'nalish haqida</div>
        <p id="yobody"></p>
        <div class="yo-focus" id="yofocus"></div>
      </div>
    </div>
  </div></section>

  <section class="block" style="padding-top:0"><div class="wrap">
    <div class="sec-head"><div><div class="kicker" data-i18n="yo_pubs">Shu yo'nalishdagi nashrlar</div></div><a class="arrow-link" href="nashrlar.html" data-i18n="all_pubs">Barcha nashrlar →</a></div>
    <div class="pub-grid" id="pubs"></div>
  </div></section>
</main>

<script src="i18n.js?v=51"></script>
<script src="admin-store.js?v=46"></script>
<script src="site-common.js?v=63"></script>
<script src="search.js?v=46"></script>
<script src="a11y.js?v=52"></script>
<script>
  Site.initPage({ active:'research', render(){
    const T = Site.t;
    const ICONS = {
      diplo:'<path d="M12 3v18M5 7l7-4 7 4M5 7v8l7 4 7-4V7M3 21h18"/>',
      shield:'<path d="M12 3 5 6v6c0 4 3 6.5 7 9 4-2.5 7-5 7-9V6z"/>',
      trade:'<path d="M3 7h18M3 7l3-4h12l3 4M5 7v13h14V7M9 11h6"/>',
      globe:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.5 3.8 5.8 3.8 9S14.5 18.5 12 21c-2.5-2.5-3.8-5.8-3.8-9S9.5 5.5 12 3Z"/>',
      chart:'<path d="M4 19V5M4 19h16M8 16v-4M12 16V8M16 16v-7"/>',
      energy:'<path d="M13 2 4 14h7l-1 8 9-12h-7z"/>'
    };
    // yo'nalish ta'rifi: ikon, kalit, nashr kategoriyasi, fokus chiplar
    const AREAS = [
      { ic:'diplo',  key:'dir1', cat:'Tashqi siyosat',  focus:['Diplomatiya','Ikki tomonlama','Xalqaro tashkilotlar'] },
      { ic:'shield', key:'dir2', cat:'Xavfsizlik',      focus:['Barqarorlik','Mudofaa','Tahdidlar'] },
      { ic:'trade',  key:'dir3', cat:'Iqtisodiyot',     focus:['Savdo','Investitsiya','Transport yo\'laklari'] },
      { ic:'globe',  key:'dir4', cat:'Markaziy Osiyo',  focus:['Suv-energetika','Chegara','Mintaqaviy aloqalar'] },
      { ic:'chart',  key:'dir5', cat:'Diplomatiya',     focus:['Prognozlash','Geosiyosat','Ssenariylar'] },
      { ic:'energy', key:'dir6', cat:'',                focus:['Energetika','Iqlim','Barqaror rivojlanish'] }
    ];
    let id = parseInt(Site.qs('id'), 10);
    if(isNaN(id) || id < 0 || id >= AREAS.length) id = 0;
    const a = AREAS[id];
    const title = T(a.key + '_t');

    document.title = title + ' — TSTM';
    document.getElementById('cr').textContent = title;
    document.getElementById('yotitle').textContent = title;
    document.getElementById('yolead').textContent = T(a.key + '_d');
    document.getElementById('yoicon').innerHTML = ICONS[a.ic];
    document.getElementById('yobody').textContent = T(a.key + '_long');
    document.getElementById('yofocus').innerHTML = a.focus.map(f=>`<span class="ch">${Site.esc(f)}</span>`).join('');

    // shu kategoriyadagi nashrlar
    let pubs = Store.all('publications').filter(p=>p.status==='published');
    if(a.cat) pubs = pubs.filter(p=> (p.category||'') === a.cat);
    pubs.sort((x,y)=>String(y.year||'').localeCompare(String(x.year||'')));
    const el = document.getElementById('pubs');
    if(!pubs.length){
      el.innerHTML = `<div class="empty" style="grid-column:1/-1"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 19a2 2 0 0 0 2 2h13"/></svg><div class="t">${T('yo_none')}</div></div>`;
    } else {
      el.innerHTML = pubs.map(p=>`
        <article class="pub rv">
          <div class="cover">${p.type?`<span class="badge">${Site.esc(Site.mlGet(p.type))}</span>`:''}${p.cover?`<img src="${p.cover}" alt="">`:`<div class="ph" style="position:absolute;inset:0;border:0"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 19a2 2 0 0 0 2 2h13"/></svg></div>`}</div>
          <div class="body"><div class="t">${Site.esc(Site.mlGet(p.category||''))}${p.year?' · '+Site.esc(p.year):''}</div><h3>${Site.esc(Site.dispTitle(p))}</h3>
            <a class="dl" href="${p.pdf||'#'}" ${p.pdf?'download':''}><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 4v11m0 0 4-4m-4 4-4-4M5 19h14" stroke-linecap="round" stroke-linejoin="round"/></svg>${p.pdf?T('download_pdf'):T('soon')}</a>
          </div>
        </article>`).join('');
    }
    Site.initReveal();
  }});
</script>
</body>
</html>
