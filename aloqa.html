<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;500;600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<link rel="stylesheet" href="subscribe.css?v=2">
</head>
<body>
<main>
  <div class="page-banner"><div class="wrap">
    <div class="crumb"><a href="Bosh sahifa - Hi-Fi.html" data-i18n="home">Bosh sahifa</a><span class="sep">/</span><span data-i18n="nav_contact">Aloqa</span></div>
    <h1 data-i18n="p_contact_title">Biz bilan bog'laning</h1>
    <p class="lead" data-i18n="p_contact_lead">Savol, taklif yoki hamkorlik bo'yicha murojaat — biz bilan bog'laning.</p>
  </div></div>
  <section class="block"><div class="wrap">
    <div class="contact-grid">
      <aside class="cinfo-wrap rv">
        <h2 class="csub" data-i18n="c_info_title">Aloqa ma'lumotlari</h2>
        <div class="cinfo" id="cinfo"></div>
        <div class="csocial" id="csocial"></div>
      </aside>
      <div class="cform-panel rv">
        <h2 class="csub" data-i18n="c_form_title">Xabar qoldiring</h2>
        <form class="cform" id="cform" novalidate>
          <div class="fld-row">
            <div class="fld"><label><span data-i18n="c_name">Ism familiya</span><span class="req">*</span></label><input type="text" placeholder="To'liq ism" data-i18n-ph="c_name_ph"></div>
            <div class="fld"><label><span data-i18n="c_email">E-pochta</span><span class="req">*</span></label><input type="email" placeholder="email@misol.uz"></div>
          </div>
          <div class="fld"><label data-i18n="c_subject">Mavzu</label><input type="text" placeholder="Murojaat mavzusi" data-i18n-ph="c_subject_ph"></div>
          <div class="fld"><label><span data-i18n="c_message">Xabar</span><span class="req">*</span></label><textarea placeholder="Xabaringizni yozing..." data-i18n-ph="c_message_ph"></textarea></div>
          <button class="btn" type="submit" id="csubmit"><span data-i18n="c_send">Xabar yuborish</span> →</button>
          <div class="cform-alert" id="cmsg" role="status" aria-live="polite"></div>
        </form>
      </div>
    </div>
    <div class="map-wrap rv">
      <div class="map-bar">
        <span class="map-addr">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 21s7-6 7-11a7 7 0 0 0-14 0c0 5 7 11 7 11Z"/><circle cx="12" cy="10" r="2.5"/></svg>
          <span id="mapAddr">Toshkent</span>
        </span>
        <a class="map-open" id="mapOpen" href="https://www.google.com/maps?q=41.310961,69.246750" target="_blank" rel="noopener"><span data-i18n="c_open_map">Xaritada ochish</span> →</a>
      </div>
      <div class="map-embed">
        <iframe id="mapFrame"
          src="https://www.google.com/maps?q=41.310961,69.246750&hl=uz&z=17&output=embed"
          loading="lazy" allowfullscreen
          referrerpolicy="no-referrer-when-downgrade" title="Xarita"></iframe>
      </div>
    </div>
  </div></section>
</main>

</html>
