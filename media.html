<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Media — TSTM</title>
<meta name="description" content="TSTM markazining foto, video va axborot materiallari.">
<link rel="icon" href="logo-mark.png">
<meta property="og:type" content="website">
<meta property="og:site_name" content="TSTM">
<meta property="og:title" content="Media — TSTM">
<meta property="og:description" content="TSTM markazining foto, video va axborot materiallari.">
<meta property="og:image" content="logo-mark.png">
<meta name="twitter:card" content="summary">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;500;600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="site.css?v=76">
<style>
  .lightbox{position:fixed;inset:0;z-index:300;background:rgba(8,11,15,.92);display:none;align-items:center;justify-content:center;padding:30px;}
  .lightbox.open{display:flex;}
  .lightbox img{max-width:92%;max-height:90%;object-fit:contain;border:1px solid rgba(255,255,255,.15);}
  .lightbox .lb-frame{width:min(92vw,1100px);aspect-ratio:16/9;border:0;}
  .lightbox .lb-close{position:absolute;top:24px;right:28px;width:46px;height:46px;border:1px solid rgba(255,255,255,.35);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;background:none;}
  .lightbox .lb-close svg{width:22px;height:22px;}
  .gtile .play{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(8,12,16,.32);transition:.2s;}
  .gtile:hover .play{background:rgba(8,12,16,.18);}
  .gtile .play span{width:58px;height:58px;border-radius:50%;background:rgba(13,68,131,.94);display:flex;align-items:center;justify-content:center;box-shadow:0 6px 22px rgba(0,0,0,.45);transition:transform .2s;}
  .gtile:hover .play span{transform:scale(1.08);}
  .gtile .play span svg{width:22px;height:22px;color:#fff;margin-left:3px;}
  .gtile .vt{position:absolute;left:0;right:0;bottom:0;padding:28px 14px 12px;background:linear-gradient(180deg,transparent,rgba(6,14,26,.85));color:#fff;font-size:0.84375rem;font-weight:500;line-height:1.3;pointer-events:none;}
  /* video — o'sha joyning o'zida (inline) ijro */
  .gtile.playing{cursor:default;background:#000;transform:none;}
  .gtile iframe{position:absolute;inset:0;width:100%;height:100%;border:0;}
  /* interaktiv infografika kartasi */
  .gtile.info-card{background:linear-gradient(140deg,var(--accent),#0b2f4d);border:0;}
  .info-card .ic-inner{position:absolute;inset:0;display:flex;flex-direction:column;padding:22px;color:#fff;}
  .info-card .ic-ico{width:34px;height:34px;opacity:.95;}
  .info-card .ic-k{font-family:var(--mono);font-size:0.65rem;letter-spacing:.16em;text-transform:uppercase;opacity:.82;margin-top:14px;}
  .info-card .ic-t{font-family:var(--serif);font-weight:600;font-size:1.1rem;line-height:1.25;margin-top:6px;}
  .info-card .ic-open{margin-top:auto;font-family:var(--mono);font-size:0.66rem;letter-spacing:.12em;text-transform:uppercase;opacity:.9;display:inline-flex;align-items:center;gap:7px;transition:gap .2s;}
  .info-card:hover .ic-open{gap:12px;}
  /* interaktiv infografika lightbox (kattaroq, oq fon) */
  .lightbox .lb-frame.tall{width:min(94vw,1180px);height:88vh;aspect-ratio:auto;background:#fff;}
  /* foto albom kartasi (isrs.uz uslubi — muqova + sarlavha + son) */
  .gtile.album{cursor:pointer;}
  .gtile.album .album-badge{position:absolute;top:12px;right:12px;z-index:2;display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:999px;background:rgba(8,12,16,.62);backdrop-filter:blur(4px);color:#fff;font-family:var(--mono);font-size:0.66rem;letter-spacing:.05em;}
  .gtile.album .album-badge svg{width:13px;height:13px;}
  .gtile.album .vt{display:flex;flex-direction:column;gap:3px;padding:34px 14px 13px;}
  .gtile.album .al-t{font-family:var(--serif);font-weight:600;font-size:0.98rem;line-height:1.25;}
  .gtile.album .al-d{font-family:var(--mono);font-size:0.64rem;letter-spacing:.06em;opacity:.85;}
  .gtile.album .vthumb{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(140deg,var(--accent),#0b2f4d);color:rgba(255,255,255,.5);}
  .gtile.album .vthumb svg{width:44px;height:44px;}
  /* albom ichki sarlavhasi + orqaga tugma */
  .album-head{grid-column:1/-1;display:flex;flex-direction:column;gap:12px;margin-bottom:4px;}
  .album-back{align-self:flex-start;display:inline-flex;align-items:center;gap:8px;padding:8px 15px 8px 12px;border:1px solid var(--line);background:none;color:var(--ink);cursor:pointer;font-family:var(--mono);font-size:0.72rem;letter-spacing:.06em;text-transform:uppercase;transition:.18s;}
  .album-back:hover{border-color:var(--accent);color:var(--accent);gap:12px;}
  .album-back svg{width:16px;height:16px;}
  .album-h{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;}
  .album-h h2{font-family:var(--serif);font-weight:600;font-size:1.5rem;line-height:1.2;margin:0;}
  .album-h .album-date{font-family:var(--mono);font-size:0.75rem;letter-spacing:.06em;color:var(--muted);}
</style>
</head>
<body>
<main>
  <div class="page-banner"><div class="wrap">
    <div class="crumb"><a href="Bosh sahifa - Hi-Fi.html" data-i18n="home">Bosh sahifa</a><span class="sep">/</span><span data-i18n="nav_media">Media</span></div>
    <h1 data-i18n="p_media_title">Media kutubxona</h1>
    <p class="lead" data-i18n="p_media_lead">Markaz tadbirlari va faoliyatidan fotosuratlar, videomateriallar va infografika.</p>
  </div></div>
  <section class="block"><div class="wrap">
    <div class="mfilter" id="tabs"></div>
    <div class="ev-head"><div class="kicker" id="mKicker"></div><span class="ev-count" id="mCount">0</span></div>
    <div class="gallery" id="gal"></div>
    <aside class="press rv" id="press"></aside>
  </div></section>
</main>
<div class="lightbox" id="lb"><button class="lb-close" id="lbClose" aria-label="Yopish"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 6l12 12M18 6 6 18"/></svg></button><div id="lbBody"></div></div>

<script src="i18n.js?v=51"></script>
<script src="admin-store.js?v=46"></script>
<script src="site-common.js?v=63"></script>
<script src="search.js?v=46"></script>
<script src="a11y.js?v=52"></script>
<script>
  Site.initPage({ active:'media', render(){
    const T = Site.t, esc = Site.esc, ml = Site.mlGet;
    const s = Site.settings();
    const gal = document.getElementById('gal');
    const tabsEl = document.getElementById('tabs');
    const kickerEl = document.getElementById('mKicker');
    const countEl = document.getElementById('mCount');
    let tab = Site.qs('tab') || 'photo';
    let albumId = Site.qs('album') || '';
    const fmtDate = (d)=>{ if(!d) return ''; const p=String(d).slice(0,10).split('-'); return p.length===3 ? p[2]+'.'+p[1]+'.'+p[0] : d; };

    // ---- lightbox ----
    const lb = document.getElementById('lb'), lbBody = document.getElementById('lbBody');
    function closeLb(){ lb.classList.remove('open'); lbBody.innerHTML=''; }
    document.getElementById('lbClose').onclick = closeLb;
    lb.onclick = (e)=>{ if(e.target===lb) closeLb(); };
    document.addEventListener('keydown', e=>{ if(e.key==='Escape' && lb.classList.contains('open')) closeLb(); });
    const ytId = (u)=>{ const m=String(u||'').match(/(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/)|youtu\.be\/)([\w-]{11})/); return m?m[1]:''; };

    // ---- kategoriyalar ----
    const TYPES = [
      { t:'photo', tk:'nav_media_photo', empty:'m_empty_photo' },
      { t:'video', tk:'nav_media_video', empty:'m_soon_video' },
      { t:'info',  tk:'nav_media_info',  empty:'m_soon_info'  }
    ];
    const EMPTY_ICON = {
      photo:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="9.5" r="1.8"/><path d="m3 17 5-4 4 3 3-3 6 5"/></svg>',
      video:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M10 9l5 3-5 3z" fill="currentColor" stroke="none"/></svg>',
      info:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M8 16v-3M12 16V9M16 16v-5" stroke-linecap="round"/></svg>'
    };
    const BACK_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>';
    const CAM_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="9.5" r="1.8"/><path d="m3 17 5-4 4 3 3-3 6 5"/></svg>';

    const all = Store.all('media');
    const byType = (t) => all.filter(m => (m.type||'photo')===t);

    // ---- foto albomlari (isrs.uz uslubi) ----
    // Haqiqiy `type:'album'` yozuvlar + eskirgan tekis `type:'photo'` rasmlar bitta "Umumiy suratlar" albomiga jamlanadi.
    function getAlbums(){
      const arr = all.filter(m=>m.type==='album').map(a=>{
        const photos = Array.isArray(a.photos) ? a.photos : [];
        return { id:a.id, title:a.title||{}, date:a.date||'', photos, cover: a.cover || (photos[0]&&photos[0].url) || '' };
      });
      const loose = all.filter(m => (m.type||'photo')==='photo');
      if(loose.length){
        arr.push({ id:'__loose', title:{uz:'Umumiy suratlar',ru:'Общие фотографии',en:'General photos'}, date:'',
          photos: loose.map(m=>({url:m.url, title:m.title||{}})), cover: loose[0].url });
      }
      return arr;
    }

    // ---- filtr chiplar (kategoriya + son) ----
    tabsEl.innerHTML = TYPES.map(x=>{
      const n = x.t==='photo' ? getAlbums().length : byType(x.t).length;
      return `<button class="fchip${x.t===tab?' on':''}" type="button" data-t="${x.t}">${esc(T(x.tk))}<span class="fc-n">${n}</span></button>`;
    }).join('');

    function empty(type){
      const meta = TYPES.find(x=>x.t===type) || TYPES[0];
      gal.innerHTML = `<div class="empty" style="grid-column:1/-1">${EMPTY_ICON[type]||EMPTY_ICON.photo}<div class="t">${esc(T(meta.empty))}</div></div>`;
    }

    function draw(){
      tabsEl.querySelectorAll('button').forEach(b=>b.classList.toggle('on', b.dataset.t===tab));
      const meta = TYPES.find(x=>x.t===tab) || TYPES[0];
      kickerEl.textContent = T(meta.tk);

      if(tab==='photo'){ drawPhotos(); return; }

      const items = byType(tab);
      countEl.textContent = items.length;
      if(!items.length){ empty(tab); return; }

      if(tab==='video'){
        // YouTube havola — tayyor video ko'rinadi, bosilganda O'SHA JOYNING O'ZIDA (inline) ijro
        gal.innerHTML = items.map(m=>{
          const id=ytId(m.url); const th=m.thumb || (id?`https://img.youtube.com/vi/${id}/hqdefault.jpg`:'');
          return `<div class="gtile rv" data-vid="${id}" data-title="${esc(ml(m.title)||'')}">${th?`<img src="${th}" alt="">`:''}<div class="play"><span><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 4l14 8-14 8z"/></svg></span></div>${ml(m.title)?`<div class="vt">${esc(ml(m.title))}</div>`:''}</div>`;
        }).join('');
        gal.querySelectorAll('.gtile').forEach(t=> t.onclick=()=>{
          const id=t.dataset.vid; if(!id || t.classList.contains('playing')) return;
          t.classList.add('playing');
          t.innerHTML = `<iframe src="https://www.youtube-nocookie.com/embed/${id}?autoplay=1&rel=0&modestbranding=1&playsinline=1&color=white" title="${t.dataset.title||''}" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>`;
        });
      } else if(tab==='info'){
        // interaktiv infografika (HTML) yoki eski statik rasm
        gal.innerHTML = items.map(m=>{
          const t = ml(m.title)||m.name||'';
          if(m.kind==='html' || /\.html?$/i.test(m.url||'')){
            return `<div class="gtile info-card rv" data-html="${esc(m.url)}" data-title="${esc(t)}">
              <div class="ic-inner">
                <svg class="ic-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M8 16v-3M12 16V9M16 16v-5" stroke-linecap="round"/></svg>
                <div class="ic-k">${esc(T('m_interactive'))}</div>
                <div class="ic-t">${esc(t)}</div>
                <div class="ic-open">${esc(T('m_open'))} <span aria-hidden="true">&rarr;</span></div>
              </div></div>`;
          }
          return `<div class="gtile rv" data-src="${esc(m.url)}"><img src="${m.url}" alt="${esc(t)}">${t?`<div class="vt">${esc(t)}</div>`:''}</div>`;
        }).join('');
        gal.querySelectorAll('.gtile').forEach(el=> el.onclick=()=>{
          if(el.dataset.html){
            // SANDBOX: allow-same-origin YO'Q — skript sayt origin'iga tegolmaydi
            lbBody.innerHTML = `<iframe class="lb-frame tall" src="${el.dataset.html}" sandbox="allow-scripts allow-popups allow-forms allow-downloads" referrerpolicy="no-referrer" title="${el.dataset.title||''}"></iframe>`;
          } else {
            lbBody.innerHTML = `<img src="${el.dataset.src}" alt="">`;
          }
          lb.classList.add('open');
        });
      }
      if (Site.initReveal) Site.initReveal();
    }

    // ---- foto: albom ro'yxati (kartalar) yoki albom ichidagi rasmlar ----
    function drawPhotos(){
      const albums = getAlbums();
      if(albumId){
        const al = albums.find(a=>a.id===albumId);
        if(!al){ albumId=''; drawPhotos(); return; }
        countEl.textContent = al.photos.length;
        const head = `<div class="album-head">
            <button class="album-back" type="button" id="albBack">${BACK_SVG}${esc(T('m_back_albums'))}</button>
            <div class="album-h"><h2>${esc(ml(al.title)||'')}</h2>${al.date?`<span class="album-date">${esc(fmtDate(al.date))}</span>`:''}</div>
          </div>`;
        gal.innerHTML = head + (al.photos.length
          ? al.photos.map(p=>`<div class="gtile rv" data-src="${esc(p.url)}"><img src="${esc(p.url)}" alt="${esc(ml(p.title)||'')}">${ml(p.title)?`<div class="vt">${esc(ml(p.title))}</div>`:''}</div>`).join('')
          : `<div class="empty" style="grid-column:1/-1">${EMPTY_ICON.photo}<div class="t">${esc(T('m_empty_photo'))}</div></div>`);
        gal.querySelector('#albBack').onclick = ()=>{ albumId=''; pushUrl(); draw(); };
        gal.querySelectorAll('.gtile[data-src]').forEach(t=> t.onclick=()=>{ lbBody.innerHTML=`<img src="${t.dataset.src}" alt="">`; lb.classList.add('open'); });
      } else {
        countEl.textContent = albums.length;
        if(!albums.length){ empty('photo'); return; }
        gal.innerHTML = albums.map(a=>`<div class="gtile album rv" data-album="${esc(a.id)}">
            ${a.cover?`<img src="${esc(a.cover)}" alt="${esc(ml(a.title)||'')}">`:`<div class="vthumb">${EMPTY_ICON.photo}</div>`}
            <span class="album-badge">${CAM_SVG}${a.photos.length}</span>
            <div class="vt"><span class="al-t">${esc(ml(a.title)||'')}</span>${a.date?`<span class="al-d">${esc(fmtDate(a.date))}</span>`:''}</div>
          </div>`).join('');
        gal.querySelectorAll('.gtile[data-album]').forEach(el=> el.onclick=()=>{ albumId=el.dataset.album; pushUrl(); draw(); });
      }
      if (Site.initReveal) Site.initReveal();
    }

    function pushUrl(){
      try{ const u=new URL(location.href); u.searchParams.set('tab',tab);
        if(tab==='photo'&&albumId) u.searchParams.set('album',albumId); else u.searchParams.delete('album');
        history.pushState({},'',u); }catch(e){}
    }
    window.addEventListener('popstate', ()=>{ tab=Site.qs('tab')||'photo'; albumId=Site.qs('album')||''; draw(); });

    tabsEl.querySelectorAll('button').forEach(b=> b.onclick=()=>{ tab=b.dataset.t; albumId=''; pushUrl(); draw(); });
    draw();

    // ---- matbuot xizmati ----
    const email = s.email || 'info@markaz.uz';
    const press = document.getElementById('press');
    if (press) press.innerHTML = `
      <div class="pl">
        <div class="pico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M3 11l16-6v14L3 13v-2Z"/><path d="M8 12.5V19l3 .8"/><path d="M19 8a3 3 0 0 1 0 8" stroke-linecap="round"/></svg></div>
        <div>
          <div class="pk">${esc(T('m_press_kicker'))}</div>
          <h2>${esc(T('m_press_title'))}</h2>
          <p>${esc(T('m_press_desc'))}</p>
        </div>
      </div>
      <div class="pcta"><a class="btn" href="mailto:${esc(email)}"><span>${esc(T('m_press_cta'))}</span> →</a></div>`;
    if (Site.initReveal) Site.initReveal();
  }});
</script>
</body>
</html>
