<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nashr — TSTM</title>
<meta name="description" content="TSTM markazi nashri — tahliliy hisobot va tadqiqot materiali.">
<link rel="icon" href="logo-mark.png">
<meta property="og:type" content="website">
<meta property="og:site_name" content="TSTM">
<meta property="og:title" content="Nashr — TSTM">
<meta property="og:description" content="TSTM markazi nashri — tahliliy hisobot va tadqiqot materiali.">
<meta property="og:image" content="logo-mark.png">
<meta name="twitter:card" content="summary">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;500;600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="site.css?v=79">
<style>
  .pub-detail{display:grid;grid-template-columns:340px 1fr;gap:54px;align-items:start;}
  .pub-detail .cov{position:relative;border:1px solid var(--line);background:var(--bg-2);aspect-ratio:3/4;overflow:hidden;}
  .pub-detail .cov img{width:100%;height:100%;object-fit:cover;}
  .pub-detail .cov .ph{position:absolute;inset:0;border:0;}
  .pub-detail .cov .badge{position:absolute;top:16px;left:16px;background:rgba(13,68,131,.92);color:#fff;font-family:var(--mono);font-size:0.625rem;letter-spacing:.12em;text-transform:uppercase;padding:6px 11px;}
  .pub-detail .dlbtn{margin-top:20px;width:100%;justify-content:center;}
  .pub-detail .metalist{margin-top:22px;border-top:1px solid var(--line);}
  .pub-detail .metalist .r{display:flex;justify-content:space-between;gap:16px;padding:12px 0;border-bottom:1px solid var(--line);font-size:0.84375rem;}
  .pub-detail .metalist .r .k{font-family:var(--mono);font-size:0.6875rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);}
  .pub-detail .metalist .r .v{color:var(--ink);font-weight:500;text-align:right;}
  /* matn ustunning butun kengligini egallasin (site.css'dagi .prose max-width:820px bekor qilinadi) */
  .pub-detail .prose{max-width:none;border:1px solid var(--line);border-radius:var(--r-media,12px);padding:30px 34px;}
  @media(max-width:860px){.pub-detail{grid-template-columns:1fr;gap:32px;}.pub-detail .cov{max-width:300px;}.pub-detail .prose{padding:20px;}}
  /* To'liq nomi — bannerdagi qisqa sarlavhadan keyin, maqoladan AVVAL alohida blok.
     Chap tomonidagi aksent chizig'i uni matndan ajratib turadi. */
  .pub-detail .full-title{position:relative;margin:0 0 30px;padding:22px 26px 24px 30px;
    background:color-mix(in srgb, var(--accent2) 6%, transparent);
    border:1px solid var(--line);border-left:0;border-radius:var(--r-media,12px);overflow:hidden;}
  .pub-detail .full-title::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent2);}
  .pub-detail .full-title .ft-lab{font-family:var(--mono);font-size:0.6875rem;letter-spacing:.12em;
    text-transform:uppercase;color:var(--accent2-d);margin-bottom:10px;}
  .pub-detail .full-title h2{font-family:var(--serif);font-weight:500;font-size:1.5rem;line-height:1.3;
    margin:0;color:var(--ink);}
  @media(max-width:860px){.pub-detail .full-title{padding:18px 18px 20px 22px;margin-bottom:24px;}
    .pub-detail .full-title h2{font-size:1.22rem;}}
  /* Muallif imzosi — maqola oxirida, o'ngga tekislangan (kartalardan olib tashlandi) */
  .pub-detail .pub-byline{margin:26px 0 0;padding-top:16px;border-top:1px solid var(--line);text-align:right;}
  .pub-detail .pub-byline .lab{display:block;font-family:var(--mono);font-size:0.6875rem;
    letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:7px;}
  .pub-detail .pub-byline .nm{font-family:var(--serif);font-size:1.0625rem;font-weight:500;
    color:var(--ink);line-height:1.5;display:inline-block;max-width:52ch;}
  @media(max-width:860px){.pub-detail .pub-byline{margin-top:20px;padding-top:13px;}
    .pub-detail .pub-byline .nm{font-size:0.98rem;}}
  /* POLISH — dumaloq burchak + elektrik porlash */
  .pub-detail .cov{border-radius:var(--r-media,12px);transition:box-shadow .28s, border-color .28s;}
  .pub-detail .cov:hover{box-shadow:var(--glow-soft);border-color:transparent;}
  .pub-detail .cov .badge{border-radius:6px;}
</style>
</head>
<body>
<main id="main"></main>

<script src="diag.js?v=1"></script>
<script src="i18n.js?v=53"></script>
<script src="admin-store.js?v=51"></script>
<script src="site-common.js?v=65"></script>
<script src="search.js?v=46"></script>
<script src="a11y.js?v=52"></script>
<script src="page-nashr.js?v=3"></script>
</body>
</html>
