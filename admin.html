<!DOCTYPE html>
<html lang="uz" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TSTM — Boshqaruv paneli</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="logo-mark.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@500;600&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="admin.css?v=2">
</head>
<body>

<!-- LOGIN -->
<div id="login" class="show">
  <form class="login-card" id="loginForm" autocomplete="off">
    <img class="lg" id="loginLogo" src="logo-tstm.png" alt="TSTM">
    <h1>Boshqaruv paneli</h1>
    <div class="sub">TSTM — administrator kirishi</div>
    <div class="login-err" id="loginErr">Login yoki parol noto'g'ri.</div>
    <div class="field"><label>Login</label><input class="ctl" id="lu" placeholder="Foydalanuvchi nomi" autocomplete="off"></div>
    <div class="field"><label>Parol</label><input class="ctl" id="lp" type="password" placeholder="••••••••" autocomplete="off"></div>
    <button class="btn primary btn-login-full" type="submit">Kirish</button>
  </form>
</div>

<!-- APP -->
<div id="app">
  <aside class="sidebar scroll" id="sidebar">
    <div class="sb-brand sb-brand-h">
      <img id="sbLogo" src="logo-mark.png" alt="TSTM">
      <span class="divider"></span>
      <span class="bn">Tashqi siyosiy<br>tadqiqotlar markazi<small>TSTM</small></span>
    </div>
    <nav class="sb-nav scroll" id="sbNav"></nav>
    <div class="sb-foot">
      <div class="sb-item" id="themeToggle">
        <svg id="themeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
        <span id="themeLabel">Quyuq rejim</span>
      </div>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <div class="burger icon-btn" id="burger"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 6h18M3 12h18M3 18h18"/></svg></div>
      <div class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3" stroke-linecap="round"/></svg>
        <input id="globalSearch" placeholder="Qidirish...">
      </div>
      <a class="icon-btn" href="Bosh sahifa - Hi-Fi.html" target="_blank" title="Saytni ko'rish">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M15 3h6v6M21 3l-9 9M21 14v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5"/></svg>
      </a>
      <div class="notif" id="notifBtn" role="button" tabindex="0" title="Bildirishnomalar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
        <span class="nb" id="notifBadge" hidden>0</span>
        <div class="notif-panel" id="notifPanel"></div>
      </div>
      <div class="userchip" id="userChip">
        <div class="avatar">A</div>
        <div><div class="un">Administrator</div><div class="ur">markaz_admini</div></div>
      </div>
    </header>
    <main class="content" id="content"></main>
  </div>
</div>

<div id="toasts"></div>

<script src="diag.js?v=1"></script>
<script src="admin-store.js?v=52"></script>
<script src="admin-ui.js?v=65"></script>
</body>
</html>
