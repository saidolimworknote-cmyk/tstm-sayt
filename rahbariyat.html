<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rahbariyat va jamoa — TSTM</title>
<meta name="description" content="TSTM markazi rahbariyati, ekspertlari va jamoasi bilan tanishing.">
<link rel="icon" href="logo-mark.png">
<meta property="og:type" content="website">
<meta property="og:site_name" content="TSTM">
<meta property="og:title" content="Rahbariyat va jamoa — TSTM">
<meta property="og:description" content="TSTM markazi rahbariyati, ekspertlari va jamoasi bilan tanishing.">
<meta property="og:image" content="logo-mark.png">
<meta name="twitter:card" content="summary">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;500;600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="site.css?v=76">
<style>
  .lp-head{display:flex;align-items:center;gap:16px;margin-bottom:28px;}
  .lp-title{font-family:var(--serif);font-weight:600;font-size:clamp(24px,2.6vw,32px);letter-spacing:.01em;color:var(--accent2-d);text-transform:uppercase;margin:0;}
  .off-list{display:flex;flex-direction:column;gap:16px;}
  .off-card{display:grid;grid-template-columns:1fr auto;align-items:stretch;border:1px solid var(--line);border-radius:12px;background:var(--panel);overflow:hidden;transition:transform .2s, box-shadow .2s, border-color .2s;}
  .off-card:hover{transform:translateY(-3px);box-shadow:0 0 0 1.5px color-mix(in srgb,var(--accent2) 45%,transparent), 0 24px 48px -26px color-mix(in srgb,var(--accent2) 45%,transparent);}
  .off-main{display:grid;grid-template-columns:200px 1fr;gap:0 30px;align-items:stretch;text-decoration:none;color:inherit;}
  .off-photo{width:200px;min-height:190px;overflow:hidden;background:var(--bg-2);flex:none;}
  .off-photo img{width:100%;height:100%;object-fit:cover;}
  .off-photo .ph{width:100%;height:100%;min-height:190px;display:flex;align-items:center;justify-content:center;color:var(--muted);}
  .off-photo .ph svg{width:36px;height:36px;opacity:.4;}
  .off-info{align-self:center;padding:24px 0;}
  .off-info .role{font-family:var(--mono);font-size:0.6875rem;letter-spacing:.08em;text-transform:uppercase;color:var(--accent2-d);margin-bottom:8px;}
  .off-info h3{font-family:var(--serif);font-weight:600;font-size:1.25rem;margin:0 0 8px;color:var(--ink);}
  .off-info .sub{color:var(--ink-2);font-size:0.875rem;line-height:1.5;max-width:56ch;}
  .off-tags{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px;}
  .off-tags span{font-family:var(--mono);font-size:0.625rem;letter-spacing:.06em;text-transform:uppercase;padding:5px 11px;border:1px solid var(--line);border-radius:999px;color:var(--muted);}
  .off-contact{align-self:stretch;display:flex;flex-direction:column;justify-content:center;gap:9px;font-family:var(--sans);font-size:0.84375rem;color:var(--ink-2);white-space:nowrap;padding:24px 30px;border-left:1px solid var(--line);}
  .off-contact a,.off-contact span{display:flex;align-items:center;gap:9px;color:var(--ink-2);text-decoration:none;}
  .off-contact a:hover{color:var(--accent2-d);}
  .off-contact svg{width:16px;height:16px;color:var(--accent2-d);flex:none;}
  @media(max-width:760px){
    /* mobil: ixcham gorizontal karta — kichik rasm chapda, matn o'ngda */
    .off-card{grid-template-columns:1fr;}
    .off-main{grid-template-columns:108px 1fr;gap:0 14px;}
    .off-photo{width:108px;min-height:132px;height:100%;}
    .off-photo .ph{min-height:132px;}
    .off-info{padding:14px 14px 12px 0;}
    .off-info .role{font-size:0.625rem;margin-bottom:5px;}
    .off-info h3{font-size:1.0625rem;margin:0 0 5px;}
    .off-info .sub{max-width:none;font-size:0.8125rem;}
    .off-tags{gap:6px;margin-top:9px;}
    .off-tags span{padding:4px 9px;}
    .off-contact{flex-direction:row;flex-wrap:wrap;justify-content:flex-start;gap:8px 18px;padding:12px 14px;border-left:0;border-top:1px solid var(--line);}
  }
  @media print{
    header,footer,.page-banner{display:none !important;}
    body.inner{padding-top:0 !important;}
    .off-card{break-inside:avoid;box-shadow:none !important;}
  }
</style>
</head>
<body>
<main>
  <div class="page-banner"><div class="wrap">
    <div class="crumb"><a href="Bosh sahifa - Hi-Fi.html" data-i18n="home">Bosh sahifa</a><span class="sep">/</span><a href="markaz-haqida.html" data-i18n="nav_about">Markaz haqida</a><span class="sep">/</span><span data-i18n="nav_about_leadership">Rahbariyat</span></div>
    <h1 data-i18n="p_leadership_title">Rahbariyat va ekspertlar</h1>
    <p class="lead" data-i18n="p_leadership_lead">Markaz jamoasi — tahlilchilar, ekspertlar va ilmiy xodimlar.</p>
  </div></div>
  <section class="block"><div class="wrap">
    <div class="lp-head">
      <h2 class="lp-title" data-i18n="nav_about_leadership">Rahbariyat</h2>
    </div>
    <div class="off-list" id="grid"></div>
  </div></section>
</main>

<script src="i18n.js?v=51"></script>
<script src="admin-store.js?v=46"></script>
<script src="site-common.js?v=63"></script>
<script src="search.js?v=46"></script>
<script src="a11y.js?v=52"></script>
<script>
  Site.initPage({ active:'about', render(){
    const T = Site.t;
    let exp = Store.all('experts').sort((a,b)=>(a.order||0)-(b.order||0));
    const el = document.getElementById('grid');
    if(!exp.length){ el.innerHTML=`<div class="empty"><div class="t">${T('none_data')}</div></div>`; return; }
    const I = {
      phone:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3 19.5 19.5 0 0 1-6-6 19.8 19.8 0 0 1-3-8.6A2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.5c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2Z"/></svg>',
      mail:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>',
      link:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M10 13a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1"/><path d="M14 11a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/></svg>',
      clock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>'
    };
    el.innerHTML = exp.map(e=>{
      const photo = e.photo ? `<img src="${e.photo}" alt="">` : `<div class="ph"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2"><circle cx="12" cy="9" r="4"/><path d="M5 21a7 7 0 0 1 14 0"/></svg></div>`;
      const contacts = [
        e.phone ? `<a href="tel:${Site.esc(e.phone.replace(/\s+/g,''))}">${I.phone}${Site.esc(e.phone)}</a>` : '',
        e.email ? `<a href="mailto:${Site.esc(e.email)}">${I.mail}${Site.esc(e.email)}</a>` : '',
        e.url ? `<a href="${Site.esc(e.url)}" target="_blank" rel="noopener">${I.link}${Site.esc(e.url)}</a>` : '',
        e.hours ? `<span>${I.clock}${Site.esc(e.hours)}</span>` : ''
      ].filter(Boolean).join('');
      const tags = Site.mlGet(e.expertise||'').split(/[,;·|]/).map(s=>s.trim()).filter(Boolean);
      return `<div class="off-card rv">
        <a class="off-main" href="expert.html?id=${e.id}">
          <div class="off-photo">${photo}</div>
          <div class="off-info">
            <div class="role">${Site.esc(Site.mlGet(e.role))}</div>
            <h3>${Site.esc(Site.mlGet(e.name))}</h3>
            <div class="sub">${Site.esc(Site.mlGet(e.sub))}</div>
            ${tags.length?`<div class="off-tags">${tags.map(t=>`<span>${Site.esc(t)}</span>`).join('')}</div>`:''}
          </div>
        </a>
        ${contacts ? `<div class="off-contact">${contacts}</div>` : ''}
      </div>`;
    }).join('');
    Site.initReveal();
  }});
</script>
</body>
</html>
