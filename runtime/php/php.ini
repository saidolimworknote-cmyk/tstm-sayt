; ==================================================================
; TSTM - portativ PHP sozlamalari
; ------------------------------------------------------------------
; Bu fayl loyihaning O'ZI bilan keladi, ya'ni sayt qaysi kompyuterda
; ishlasa ham AYNI sozlamalar bilan ishlaydi. "Menda ishlayapti, sizda
; ishlamayapti" holati shu tarzda yo'q qilingan.
;
; Ishga tushiruvchi (`tools\ishga-tushur.ps1`) buni `-c` kaliti bilan
; beradi va `extension_dir` ni mutlaq yo'l qilib qayta ko'rsatadi.
; ==================================================================

; ---- Kengaytmalar ------------------------------------------------
; Nisbiy yo'l joriy papkaga bog'liq bo'lgani uchun ishonchsiz -
; ishga tushiruvchi buni mutlaq yo'l bilan qayta yozadi. Bu yerdagi
; qiymat faqat `php` ni qo'lda chaqirganda ishlaydi.
extension_dir = "ext"

; pdo_mysql - butun baza qatlami (db.php)
extension = pdo_mysql
; openssl  - push-bildirishnoma imzosi (VAPID) va TLS
extension = openssl
; mbstring - ko'p tilli matn (mb_strtolower, mb_substr)
extension = mbstring
; curl     - push xizmatiga so'rov
extension = curl

; ---- Yuklash chegaralari -----------------------------------------
; Admin panel orqali rasm (12 MB gacha) va hujjat (30 MB gacha)
; yuklanadi. Zaxira sifatida kengroq chegara qo'yamiz; haqiqiy
; tekshiruv `api.php` ichida, ya'ni serverga bog'liq emas.
upload_max_filesize = 64M
post_max_size = 64M
memory_limit = 256M
max_execution_time = 120

; ---- Xatolar -----------------------------------------------------
; display_errors = Off - xato matni brauzerga CHIQMAYDI. Xato matnida
; fayl yo'llari va SQL parchalari bo'ladi, ular hujumchiga ma'lumot
; beradi. Buning o'rniga hammasi jurnalga yoziladi.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL
; Bo'sh qoldirilsa PHP stderr ga yozadi - ishga tushirish oynasida
; darhol ko'rinadi, alohida fayl kerak emas.
error_log =

; ---- Xavfsizlik --------------------------------------------------
; X-Powered-By sarlavhasini o'chiradi (PHP versiyasini oshkor qilmaydi)
expose_php = Off

; Sessiya cookie'si: JS o'qiy olmasin (XSS da o'g'irlanmasin),
; boshqa saytdan yuborilgan so'rovga qo'shilmasin (CSRF).
session.cookie_httponly = 1
session.cookie_samesite = Lax
session.use_strict_mode = 1
session.use_only_cookies = 1
session.name = TSTMSESS
; Sessiya fayllari loyiha ichida (`data\sessions`) - tizim temp
; papkasida boshqa loyihalar bilan aralashmaydi. git'ga tushmaydi.
session.save_path = "data/sessions"

; ---- Mahalliy ----------------------------------------------------
date.timezone = Asia/Tashkent
default_charset = "UTF-8"
